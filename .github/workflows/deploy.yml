name: Build & Deploy to itch.io

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── 0. Tests ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group test

      - name: Run tests
        run: uv run pytest -v

  # ── 1. Web build (pygbag) ─────────────────────────────────────────────────
  build-web:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group web

      - name: Build web
        working-directory: src
        run: uv run pygbag --build main.py

      - name: Report build size
        run: |
          size=$(du -sb src/build/web/ | cut -f1)
          python -c "print('Web build size: {:.1f} MB ({} bytes)'.format($size/1048576, $size))"

      - name: Read version
        id: version
        run: echo "tag=$(python -c 'from src.version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Install butler
        run: |
          mkdir -p ./tools
          curl -sSLfo ./tools/butler.zip "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          unzip -o ./tools/butler.zip -d ./tools
          chmod +x ./tools/butler
          ./tools/butler -V

      - name: Read itch.io config
        id: itch
        run: |
          echo "user=$(grep 'user' .itch.toml | sed 's/.*= *"//' | sed 's/".*//')" >> "$GITHUB_OUTPUT"
          echo "game=$(grep 'game' .itch.toml | sed 's/.*= *"//' | sed 's/".*//')" >> "$GITHUB_OUTPUT"

      - name: Push to itch.io
        run: ./tools/butler push src/build/web/ ${{ steps.itch.outputs.user }}/${{ steps.itch.outputs.game }}:html5 --userversion ${{ steps.version.outputs.tag }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}

  # ── 2. Native builds (PyInstaller matrix) ────────────────────────────────
  build-and-deploy:
    name: build-and-deploy (${{ matrix.platform }})
    needs: [test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            channel: linux
            butler_platform: linux-amd64
            executable: dist/PyLinkx
            add_data_sep: ":"
            extra_flags: ""
            size_cmd: "stat -c%s dist/PyLinkx"

          - os: windows-latest
            platform: windows
            channel: windows
            butler_platform: windows-amd64
            executable: dist/PyLinkx.exe
            add_data_sep: ";"
            extra_flags: "--windowed"
            size_cmd: "powershell -Command \"(Get-Item dist\\PyLinkx.exe).Length\""

          - os: macos-latest
            platform: macos
            channel: osx
            butler_platform: darwin-amd64
            executable: dist/PyLinkx
            add_data_sep: ":"
            extra_flags: "--windowed"
            size_cmd: "stat -f%z dist/PyLinkx"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group build

      - name: Build executable
        run: >
          uv run pyinstaller --onefile --name PyLinkx ${{ matrix.extra_flags }}
          --paths src
          --add-data "src/models${{ matrix.add_data_sep }}models"
          --add-data "src/assets${{ matrix.add_data_sep }}assets"
          --hidden-import game.game
          --hidden-import game.game_renderer
          --hidden-import game.menu_renderer
          --hidden-import game.player
          --hidden-import game.piece
          --collect-all onnxruntime
          --exclude-module torch
          --exclude-module torchvision
          --exclude-module torchaudio
          --exclude-module stable_baselines3
          --exclude-module sb3_contrib
          src/main.py

      - name: Report executable size
        shell: bash
        run: |
          size=$(${{ matrix.size_cmd }})
          python -c "print('${{ matrix.platform }} executable size: {:.1f} MB ({} bytes)'.format($size/1048576, $size))"

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=$(python -c 'from src.version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Install butler (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p ./tools
          curl -sSLfo ./tools/butler.zip "https://broth.itch.zone/butler/${{ matrix.butler_platform }}/LATEST/archive/default"
          unzip -o ./tools/butler.zip -d ./tools
          chmod +x ./tools/butler
          ./tools/butler -V

      - name: Install butler (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ./tools
          Invoke-WebRequest -Uri "https://broth.itch.zone/butler/${{ matrix.butler_platform }}/LATEST/archive/default" -OutFile ./tools/butler.zip
          Expand-Archive -Path ./tools/butler.zip -DestinationPath ./tools -Force
          ./tools/butler.exe -V

      - name: Read itch.io config
        id: itch
        shell: bash
        run: |
          echo "user=$(grep 'user' .itch.toml | sed 's/.*= *"//' | sed 's/".*//')" >> "$GITHUB_OUTPUT"
          echo "game=$(grep 'game' .itch.toml | sed 's/.*= *"//' | sed 's/".*//')" >> "$GITHUB_OUTPUT"

      - name: Push to itch.io (Linux/macOS)
        if: matrix.platform != 'windows'
        run: ./tools/butler push ${{ matrix.executable }} ${{ steps.itch.outputs.user }}/${{ steps.itch.outputs.game }}:${{ matrix.channel }} --userversion ${{ steps.version.outputs.tag }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}

      - name: Push to itch.io (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: ./tools/butler.exe push ${{ matrix.executable }} ${{ steps.itch.outputs.user }}/${{ steps.itch.outputs.game }}:${{ matrix.channel }} --userversion ${{ steps.version.outputs.tag }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
