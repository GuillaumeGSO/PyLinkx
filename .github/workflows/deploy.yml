name: Build & Deploy to itch.io

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── 0. Tests ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  # ── 1. Web build (pygbag) ─────────────────────────────────────────────────
  build-web:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pygbag pygame-ce

      - name: Build web
        working-directory: src
        run: pygbag --build main.py

      - uses: actions/upload-artifact@v5
        with:
          name: build-web
          path: src/build/web/

  # ── 2. Windows build (PyInstaller) ────────────────────────────────────────
  build-windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --name PyLinkx
          --paths src
          --add-data "src/models;models"
          --add-data "src/assets;assets"
          --hidden-import game.game
          --hidden-import game.game_renderer
          --hidden-import game.menu_renderer
          --hidden-import game.player
          --hidden-import game.piece
          --hidden-import sb3_contrib
          --collect-data stable_baselines3
          --collect-data sb3_contrib
          src/main.py

      - uses: actions/upload-artifact@v5
        with:
          name: build-windows
          path: dist/

  # ── 3. macOS build (PyInstaller) ──────────────────────────────────────────
  build-macos:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build app
        run: >
          pyinstaller --onefile --windowed --name PyLinkx
          --paths src
          --add-data "src/models:models"
          --add-data "src/assets:assets"
          --hidden-import game.game
          --hidden-import game.game_renderer
          --hidden-import game.menu_renderer
          --hidden-import game.player
          --hidden-import game.piece
          --hidden-import sb3_contrib
          --collect-data stable_baselines3
          --collect-data sb3_contrib
          src/main.py

      - uses: actions/upload-artifact@v5
        with:
          name: build-macos
          path: dist/

  # ── 4. Linux build (PyInstaller) ──────────────────────────────────────────
  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build binary
        run: >
          pyinstaller --onefile --name PyLinkx
          --paths src
          --add-data "src/models:models"
          --add-data "src/assets:assets"
          --hidden-import game.game
          --hidden-import game.game_renderer
          --hidden-import game.menu_renderer
          --hidden-import game.player
          --hidden-import game.piece
          --hidden-import sb3_contrib
          --collect-data stable_baselines3
          --collect-data sb3_contrib
          src/main.py

      - uses: actions/upload-artifact@v5
        with:
          name: build-linux
          path: dist/

  # ── 5. Deploy to itch.io (butler) ─────────────────────────────────────────
  deploy:
    needs: [build-web, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .itch.toml
            version.py
          sparse-checkout-cone-mode: false

      - name: Read itch.io config
        id: itch
        run: |
          echo "user=$(grep 'user' .itch.toml | sed 's/.*= *"//' | sed 's/".*//')" >> "$GITHUB_OUTPUT"
          echo "game=$(grep 'game' .itch.toml | sed 's/.*= *"//' | sed 's/".*//')" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: version
        run: |
          echo "tag=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        with:
          name: build-web
          path: ./artifacts/web

      - uses: actions/download-artifact@v5
        with:
          name: build-windows
          path: ./artifacts/windows

      - uses: actions/download-artifact@v5
        with:
          name: build-macos
          path: ./artifacts/macos

      - uses: actions/download-artifact@v5
        with:
          name: build-linux
          path: ./artifacts/linux

      - name: Install butler
        run: |
          mkdir -p ./tools
          curl -sSLfo ./tools/butler.zip "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          unzip -o ./tools/butler.zip -d ./tools
          chmod +x ./tools/butler
          ./tools/butler -V
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}

      - name: Push web
        run: ./tools/butler push ./artifacts/web/ ${{ steps.itch.outputs.user }}/${{ steps.itch.outputs.game }}:html5 --userversion ${{ steps.version.outputs.tag }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}

      - name: Push windows
        run: ./tools/butler push ./artifacts/windows/ ${{ steps.itch.outputs.user }}/${{ steps.itch.outputs.game }}:windows --userversion ${{ steps.version.outputs.tag }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}

      - name: Push macos
        run: ./tools/butler push ./artifacts/macos/ ${{ steps.itch.outputs.user }}/${{ steps.itch.outputs.game }}:osx --userversion ${{ steps.version.outputs.tag }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}

      - name: Push linux
        run: ./tools/butler push ./artifacts/linux/ ${{ steps.itch.outputs.user }}/${{ steps.itch.outputs.game }}:linux --userversion ${{ steps.version.outputs.tag }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
