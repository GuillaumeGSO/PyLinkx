[project]
name = "pylinkx"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "stable-baselines3>=2.0.0",
    "sb3-contrib>=2.0.0",
]

[dependency-groups]
dev = [
    "stable-baselines3[extra]>=2.0.0",
    "pytest",
    "pygbag",
]
build = [
    "pyinstaller",
]

