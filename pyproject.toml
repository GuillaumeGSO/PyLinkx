[project]
name = "pylinkx"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
]

[dependency-groups]
train = [
    "stable-baselines3>=2.0.0",
    "sb3-contrib>=2.0.0",
]
test = [
    {include-group = "train"},
    "pytest",
]
export = [
    {include-group = "train"},
    "onnxscript",
]
web = [
    "pygbag",
]
build = [
    "pyinstaller",
]
